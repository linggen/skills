<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Shifu</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="doctor.css">
  <link rel="stylesheet" href="media.css">
</head>
<body>
  <div class="header">
    <h1>Apple Shifu</h1>
    <div class="apptabs">
      <button class="atab" data-tab="system">🩺 System</button>
      <button class="atab" data-tab="media" title="Connect your iPhone by USB — manage photos and videos on both Mac and iPhone">📷 Media</button>
      <button class="atab" data-tab="files" title="Downloads, large files, duplicates and caches on this Mac">📁 Files</button>
    </div>
    <!-- One selected device for the whole app; every tab follows it. -->
    <div class="source-switch" id="source-switch"></div>
    <!-- "No delete before backup" is product-wide, so its state is too. -->
    <span class="backup-badge" id="backup-badge" hidden></span>
    <button id="settings-btn" class="gear-btn" title="Settings" aria-label="Settings">⚙</button>
  </div>

  <div class="doctor-container">
    <div class="work-panel">
      <!-- The four verbs, same position and order in every tab. Each tab
           supplies what sits behind them (shifu-shell.js). -->
      <div class="verbs-toolbar" id="verbs-toolbar"></div>

      <!-- System tab: model-driven dashboard (💻) or the Mac's iPhone read (📱) -->
      <div class="view-panel" id="view-panel">
        <div class="mac-system" id="mac-system">
          <div class="top-bar-area" id="top-bar-area"></div>
          <div class="stale-banner" id="stale-banner" hidden></div>
          <div class="body-area" id="body-area"></div>
          <div class="footer-area" id="footer-area"></div>
        </div>
        <div class="phone-system" id="phone-system" hidden></div>
      </div>

      <!-- Media tab: iPhone + Mac photo/video cleanup (media.js owns this pane) -->
      <div class="media-panel" id="media-panel" hidden></div>

      <!-- Files tab: this Mac's Downloads, large files, duplicates, caches -->
      <div class="media-panel" id="files-panel" hidden></div>
    </div>

    <!-- Right: chat panel (always fixed, shared across tabs) -->
    <div class="chat-panel" id="chat-panel"></div>
  </div>

  <script type="module" src="chat-bridge.js"></script>
  <script type="module" src="doctor.js"></script>
  <script type="module" src="media.js"></script>
  <script type="module" src="files.js"></script>
  <script type="module" src="app-mode.js"></script>
</body>
</html>
