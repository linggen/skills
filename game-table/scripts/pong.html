<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="stylesheet" href="arcade.css">
    <link rel="stylesheet" href="pong.css">
</head>
<body>
    <script src="games-nav.js"></script>
    <main class="arcade-shell">
        <section id="pongGameContainer" class="game-container" style="display: flex;">
            <div class="game-header">
                <div>
                    <p class="game-kicker">Versus Arcade</p>
                    <h1>Pong Game</h1>
                </div>
            </div>

            <div class="status-bar status-bar-wide">
                <div class="pong-score status-pill">
                    Player 1: <span id="player1Score">0</span>
                    <span class="score-divider">-</span>
                    Player 2: <span id="player2Score">0</span>
                </div>
                <div class="status-hint">W/S for Player 1 · ↑/↓ for Player 2</div>
            </div>

            <div class="canvas-frame pong-frame">
                <canvas id="pongCanvas" width="600" height="400"></canvas>
                <div id="pong-overlay" class="tetris-overlay" style="display: flex;">
                    <div class="overlay-card">
                        <p id="pongOverlayTitle" class="overlay-title">Pong</p>
                        <p id="pongOverlayCopy" class="overlay-copy">First to 11 wins — W/S moves the left paddle, ↑/↓ the right.</p>
                        <div class="overlay-actions">
                            <button id="pongStartButton" class="utility-button">Start Game</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="pong.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initPong();
        });
    </script>
</body>
</html>
