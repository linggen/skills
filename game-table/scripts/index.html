<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Games</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <!-- No lobby — reopen the last game played (the rail on every game page
       is the menu). Falls back to xiangqi for a first visit or a stale key. -->
  <script>
    const KNOWN = ['xiangqi.html', 'gomoku.html', 'snake.html', 'pong.html', 'tetris.html'];
    let game = KNOWN[0];
    try {
      const ui = JSON.parse(localStorage.getItem('game-table:ui')) || {};
      if (KNOWN.includes(ui.game)) game = ui.game;
    } catch { /* first visit */ }
    location.replace(game);
  </script>
</head>
<body style="background:#1a1a2e"></body>
</html>
