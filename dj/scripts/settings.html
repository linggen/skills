<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ — Settings</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="dj.css" />
  <style>
    body { padding: 24px; max-width: 560px; margin: 0 auto; }
    h1 { font-size: 18px; margin: 0 0 18px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
    .field input, .field select {
      width: 100%; padding: 9px 11px; background: var(--panel-2);
      border: 1px solid var(--line); border-radius: 9px; color: var(--ink); font-size: 14px;
    }
    .hint { color: var(--muted); font-size: 11px; margin-top: 5px; }
    fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 0 0 18px; }
    legend { color: var(--accent); font-size: 12px; padding: 0 6px; text-transform: uppercase; letter-spacing: .06em; }
    .bar { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
    .status { font-size: 12px; }
    .status.ok { color: var(--pos); }
    .status.bad { color: var(--warn); }
    .lm-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; margin-bottom: 12px; }
    .lm-title { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 4px; }
    .lm-badge { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--pos); border: 1px solid var(--pos); border-radius: 99px; padding: 1px 7px; }
    .lm-device { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .lm-device + .lm-device { border-top: 1px solid var(--line); }
    .lm-device .who { flex: 1; min-width: 0; }
    .lm-device .who b { font-size: 13px; }
    .lm-device .who .hint { margin-top: 2px; }
    .lm-cover { width: 120px; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; flex: none; }
    .lm-cover i { display: block; height: 100%; background: var(--pos); }
    .lm-qr { display: flex; gap: 14px; align-items: center; margin-top: 10px; }
    .lm-qr svg { width: 108px; height: 108px; border-radius: 8px; background: #fff; padding: 5px; flex: none; }
    .lm-steps { font-size: 12px; color: var(--muted); line-height: 1.9; }
  </style>
</head>
<body>
  <h1>DJ settings</h1>

  <div class="field">
    <label for="library_dir">Library folder</label>
    <input id="library_dir" type="text" placeholder="~/Music/DJ" />
    <div class="hint">Where downloaded MP3s are saved on this Mac.</div>
  </div>

  <div class="field">
    <label for="bitrate">Quality</label>
    <select id="bitrate">
      <option value="320">320 kbps (best MP3)</option>
      <option value="256">256 kbps</option>
      <option value="192">192 kbps</option>
      <option value="best">Best available</option>
    </select>
  </div>

  <div class="field">
    <label for="karaoke_source">Karaoke source</label>
    <select id="karaoke_source">
      <option value="audio">Audio — lighter, drag lyrics to sync</option>
      <option value="video">Video — lyrics on screen, guaranteed in sync</option>
    </select>
    <div class="hint">Audio grabs a small instrumental MP3 and finds lyrics; video downloads the full karaoke clip. Audio syncs to your phone.</div>
  </div>

  <div class="field">
    <label for="naming_template">File naming</label>
    <input id="naming_template" type="text" placeholder="%(artist)s - %(title)s" />
    <div class="hint">Fields: <code>%(artist)s</code>, <code>%(title)s</code>, <code>%(year)s</code>.</div>
  </div>

  <fieldset>
    <legend>Phone</legend>

    <!-- Linggen Mobile pulls the library itself over the paired channel;
         nothing to configure here. A device card when paired, the pairing QR
         when not. -->
    <div id="lm-card" class="lm-card">
      <div class="hint">Checking for paired phones…</div>
    </div>

  </fieldset>

  <div class="bar">
    <button class="btn" id="save-btn">Save</button>
    <span class="status" id="save-status"></span>
  </div>

  <script type="module">
    import { loadConfig, saveConfig, loadLibrary } from './library.js';
    import { phoneDevices, coverage, pairQr, agoLabel } from './phone.js';
    import { $, esc } from './ui.js';
    let cfg = {};

    // The Linggen Mobile card: paired → per-device coverage; not paired → the
    // pairing QR right here (same single-use mint as Settings → Phone).
    async function renderPhoneCard() {
      const card = $('lm-card');
      const [devices, lib] = await Promise.all([phoneDevices(), loadLibrary()]);
      if (devices.length) {
        const rows = devices.map((d) => {
          // Measured against what the phone should carry, not the whole library.
          const c = coverage((lib.tracks || []).filter((t) => t.on_phone), d);
          const pct = c.total ? Math.round((c.synced / c.total) * 100) : 0;
          const waiting = c.waiting
            ? `${c.waiting} waiting`
            : `up to date • ${agoLabel(d.last_fetch)}`;
          return `<div class="lm-device">
            <div class="who"><b>📱 ${esc(d.name)}</b><div class="hint">${c.synced}/${c.total} songs • ${waiting}</div></div>
            <div class="lm-cover"><i style="width:${pct}%"></i></div>
          </div>`;
        }).join('');
        card.innerHTML = `<div class="lm-title">Linggen Mobile <span class="lm-badge">wireless</span></div>
          <div class="hint">Your phone carries the songs you add to it and fetches them itself.</div>${rows}`;
        return;
      }
      const qr = await pairQr();
      card.innerHTML = `<div class="lm-title">Linggen Mobile <span class="lm-badge">recommended</span></div>
        <div class="hint">Wireless sync, offline play, synced lyrics — no cables, no third-party player.</div>
        <div class="lm-qr">${qr ? qr.svg : ''}
          <div class="lm-steps">1. Get Linggen Mobile on your iPhone<br/>2. Scan this code with the Camera app<br/>3. Confirm on this Mac — music syncs itself</div>
        </div>`;
    }
    renderPhoneCard();

    (async function load() {
      cfg = await loadConfig();
      $('library_dir').value = cfg.library_dir || '~/Music/DJ';
      $('bitrate').value = cfg.bitrate || '320';
      $('karaoke_source').value = cfg.karaoke_source || 'audio';
      $('naming_template').value = cfg.naming_template || '%(artist)s - %(title)s';
    })();

    $('save-btn').onclick = async () => {
      cfg.library_dir = $('library_dir').value.trim() || '~/Music/DJ';
      cfg.bitrate = $('bitrate').value;
      cfg.karaoke_source = $('karaoke_source').value;
      cfg.naming_template = $('naming_template').value.trim() || '%(artist)s - %(title)s';
      delete cfg.sync_targets; // the VLC/WebDAV push is gone
      const s = $('save-status');
      try {
        await saveConfig(cfg);
        s.textContent = 'Saved ✓'; s.className = 'status ok';
      } catch (e) {
        s.textContent = String(e.message || e); s.className = 'status bad';
      }
    };
  </script>
</body>
</html>
