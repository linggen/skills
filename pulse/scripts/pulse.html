<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="pulse.css">
</head>
<body>
  <div class="app">

    <!-- HEADER (full width) -->
    <header class="header">
      <h1>Pulse</h1>
      <a href="settings.html" id="settings-link" title="Configure sources, targets, and brief">⚙ Settings</a>
    </header>

    <!-- Settings overlay — loads settings.html in an in-page modal so
         pulse.html (and the chat iframe) is never unmounted. -->
    <div class="settings-modal" id="settings-modal" hidden>
      <div class="settings-modal-backdrop" data-close="1"></div>
      <div class="settings-modal-panel">
        <button class="settings-modal-close" id="settings-close" title="Close settings">✕</button>
        <iframe class="settings-modal-iframe" id="settings-iframe" title="Pulse settings"></iframe>
      </div>
    </div>

    <!-- LEFT SIDEBAR (sessions) — Linggen's BareSessions iframe, filtered
         to creator=skill skill=pulse. Selection/create flow back to us via
         postMessage; we navigate the top window so the chat iframe re-mounts
         on the chosen session. -->
    <aside class="sidebar" id="sidebar">
      <iframe class="sessions-frame" id="sessions-iframe" title="Pulse sessions"></iframe>
    </aside>

    <!-- MIDDLE COLUMN (cards for the selected session) -->
    <main class="inbox">

      <!-- Session header — populated when a session is selected -->
      <div class="session-header" id="session-header">
        <div class="session-header-text">
          <div class="title" id="session-title">Pulse</div>
          <div class="sub" id="session-sub"></div>
        </div>
        <button class="new-session-btn" id="new-session-btn"
                title="Start a fresh Pulse session and run today's brief">
          ✦ New session
        </button>
      </div>

      <!-- Pipeline chips: gather local → gather web → draft. Each chip = one
           step the agent (or a script) runs. Click a chip to (re-)run that
           step independently. A NEW session (New-session button → ?new=1, or
           first-ever open) auto-cascades the two gather steps; a plain open
           resumes the most-recent session statically. -->
      <div class="action-chips pipeline">
        <button class="chip step" data-chip="gather-local" data-state="idle"
                title="Pull yesterday's commits, sessions, and changed files">
          <span class="ic">📂</span>
          <span class="label">Gather local</span>
          <span class="state-ic" aria-hidden="true"></span>
        </button>
        <button class="chip step" data-chip="gather-web" data-state="idle"
                title="Pull web signal from configured sources, topic-aware">
          <span class="ic">🌐</span>
          <span class="label">Gather web</span>
          <span class="state-ic" aria-hidden="true"></span>
        </button>
        <button class="chip step" data-chip="draft" data-state="idle"
                title="Draft posts for enabled target lanes from gathered context">
          <span class="ic">✎</span>
          <span class="label">Draft</span>
          <span class="state-ic" aria-hidden="true"></span>
        </button>
      </div>

      <!-- Cascade toast — shown when the auto-cascade fires on first open of
           the day. Non-blocking; user can stop it. -->
      <div class="cascade-toast" id="cascade-toast" hidden>
        <span class="cascade-toast-label" id="cascade-toast-label">Running today's brief…</span>
        <button class="cascade-toast-stop" id="cascade-toast-stop">Stop</button>
      </div>

      <!-- Status strip — populated from state/ files -->
      <div class="status" id="status-strip" hidden></div>

      <!-- Sections — populated by pulse-render.js applying body_patches -->
      <div id="sections-container">
        <div class="state-msg" id="sections-loading">Loading…</div>
      </div>

    </main>

    <!-- RIGHT COLUMN (chat) — chat-bridge.mount appends an iframe here -->
    <aside class="chat" id="chat-panel"></aside>

  </div>

  <script type="module" src="chat-bridge.js"></script>
  <script type="module" src="pulse-app.js"></script>
</body>
</html>
