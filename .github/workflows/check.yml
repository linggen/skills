name: check

# Every skill's tests on each push and PR: the same commands as scripts/check.sh.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS: apple-shifu drives BSD tools and the Trash; the repo is public, so
    # macOS minutes are free.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run checks
        run: ./scripts/check.sh
