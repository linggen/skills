<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sys Doctor</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="style.css">
  <style>
    .lobby {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: calc(100vh - 48px);
      padding: 48px 20px;
      gap: 28px;
    }
    .lobby-icon { font-size: 48px; line-height: 1; }
    .lobby-title { font-size: 26px; font-weight: 700; text-align: center; }
    .lobby-subtitle { color: var(--text-muted); font-size: 14px; margin-top: -16px; text-align: center; }
    .model-bar { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-muted); }
    .model-bar select { min-width: 200px; }
    .scan-grid {
      display: grid;
      grid-template-columns: repeat(3, 180px);
      gap: 16px;
      justify-content: center;
    }
    .scan-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      text-align: center;
    }
    .scan-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.15);
    }
    .scan-card .scan-icon { font-size: 32px; line-height: 1; }
    .scan-card .scan-name { font-size: 15px; font-weight: 700; }
    .scan-card .scan-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
    .sessions-section { width: 100%; max-width: 540px; }
    .sessions-section h3 { font-size: 14px; margin-bottom: 8px; color: var(--text-muted); }
    .session-list { display: flex; flex-direction: column; gap: 6px; }
    .session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .session-info { display: flex; flex-direction: column; gap: 2px; cursor: pointer; flex: 1; }
    .session-title { font-weight: 500; }
    .session-date { color: var(--text-muted); font-size: 11px; }
    .btn-delete {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 11px;
    }
    .btn-delete:hover { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>
  <div class="header">
    <h1>Sys Doctor</h1>
  </div>
  <div class="lobby">
    <div class="lobby-icon">&#x1FA7A;</div>
    <h2 class="lobby-title">System Health Check</h2>
    <p class="lobby-subtitle">Scan your machine, get AI-powered diagnosis and cleanup advice</p>
    <div class="model-bar">
      <label>Model:</label>
      <select id="model-select"><option>Loading models...</option></select>
    </div>
    <div class="scan-grid">
      <div class="scan-card" data-scan="full">
        <div class="scan-icon">&#x1F50D;</div>
        <div class="scan-name">Full Scan</div>
        <div class="scan-desc">Disk, apps, caches, system info — the complete picture</div>
      </div>
      <div class="scan-card" data-scan="disk">
        <div class="scan-icon">&#x1F4BE;</div>
        <div class="scan-name">Disk Only</div>
        <div class="scan-desc">Disk usage, large files, garbage candidates</div>
      </div>
      <div class="scan-card" data-scan="quick">
        <div class="scan-icon">&#x26A1;</div>
        <div class="scan-name">Quick Check</div>
        <div class="scan-desc">System info + disk summary in seconds</div>
      </div>
    </div>
    <div class="sessions-section" id="sessions-section" style="display:none">
      <h3>Past Scans</h3>
      <div class="session-list" id="session-list"></div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
