<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sys Doctor</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="doctor.css">
</head>
<body>
  <div class="header">
    <h1>Sys Doctor</h1>
  </div>

  <div class="doctor-container">
    <!-- Left: model-driven view panel -->
    <div class="view-panel" id="view-panel">
      <div class="top-bar-area" id="top-bar-area"></div>
      <!-- Static tools toolbar — always visible (sticky), single source of
           truth for every dashboard action. Rescan buttons map to the agent's
           Scan* tools; deep / photo buttons route to iframe-side handlers. -->
      <div class="tools-toolbar" id="tools-toolbar">
        <button class="tool-btn" data-msg="Scan disk and show top space consumers">
          <span class="tool-icon">💾</span>
          <span class="tool-label">Rescan Disk</span>
        </button>
        <button class="tool-btn" data-msg="Run a security check">
          <span class="tool-icon">🔒</span>
          <span class="tool-label">Rescan Security</span>
        </button>
        <button class="tool-btn" data-msg="Check performance">
          <span class="tool-icon">⚡</span>
          <span class="tool-label">Rescan Performance</span>
        </button>
        <button class="tool-btn" data-msg="Find large files and label them">
          <span class="tool-icon">📦</span>
          <span class="tool-label">Find Large Files</span>
        </button>
      </div>
      <div class="body-area" id="body-area"></div>
      <div class="footer-area" id="footer-area"></div>
    </div>

    <!-- Right: chat panel (always fixed) -->
    <div class="chat-panel" id="chat-panel"></div>
  </div>

  <script type="module" src="chat-bridge.js"></script>
  <script type="module" src="doctor.js"></script>
</body>
</html>
