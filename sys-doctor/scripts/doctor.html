<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sys Doctor</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="doctor.css">
  <link rel="stylesheet" href="media.css">
</head>
<body>
  <div class="header">
    <h1>Sys Doctor</h1>
  </div>

  <div class="apptabs">
    <button class="atab" data-tab="system">🩺 System</button>
    <button class="atab" data-tab="media" title="Connect your iPhone by USB — manage photos and videos on both Mac and iPhone">📷 Media</button>
  </div>

  <div class="doctor-container">
    <!-- Left: model-driven view panel -->
    <div class="view-panel" id="view-panel">
      <div class="top-bar-area" id="top-bar-area"></div>
      <!-- Static tools toolbar — always visible (sticky), single source of
           truth for every dashboard action. Rescan buttons map to the agent's
           Scan* tools; deep / photo buttons route to iframe-side handlers. -->
      <div class="tools-toolbar" id="tools-toolbar">
        <button class="tool-btn" id="rescan-btn" title="Run a fresh full scan — CPU, memory, disk, battery, security, performance">
          <span class="tool-icon">↻</span>
          <span class="tool-label">Full Rescan</span>
        </button>
        <button class="tool-btn" data-msg="Scan disk and show top space consumers">
          <span class="tool-icon">💾</span>
          <span class="tool-label">Rescan Disk</span>
        </button>
        <button class="tool-btn" data-msg="Run a security check">
          <span class="tool-icon">🔒</span>
          <span class="tool-label">Rescan Security</span>
        </button>
        <button class="tool-btn" data-msg="Check performance">
          <span class="tool-icon">⚡</span>
          <span class="tool-label">Rescan Performance</span>
        </button>
        <button class="tool-btn" data-msg="Find large files and label them">
          <span class="tool-icon">📦</span>
          <span class="tool-label">Find Large Files</span>
        </button>
        <button class="tool-btn" data-msg="Generate a Buyer's Guide for my Mac">
          <span class="tool-icon">🛒</span>
          <span class="tool-label">Buyer's Guide</span>
        </button>
        <span id="last-scan-label" class="last-scan"></span>
      </div>
      <div class="stale-banner" id="stale-banner" hidden></div>
      <div class="body-area" id="body-area"></div>
      <div class="footer-area" id="footer-area"></div>
    </div>

    <!-- Media tab: iPhone + Mac photo/video cleanup (media.js owns this pane) -->
    <div class="media-panel" id="media-panel" hidden></div>

    <!-- Right: chat panel (always fixed, shared across tabs) -->
    <div class="chat-panel" id="chat-panel"></div>
  </div>

  <script type="module" src="chat-bridge.js"></script>
  <script type="module" src="doctor.js"></script>
  <script type="module" src="media.js"></script>
  <script type="module" src="app-mode.js"></script>
</body>
</html>
