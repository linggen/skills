<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linggen Health</title>
  <link rel="stylesheet" href="health.css" />
</head>
<body>
  <header class="top">
    <h1>Linggen Health</h1>
    <button id="refresh" type="button">Refresh</button>
    <!-- What the pass found and what this Mac holds. Counts, never a score. -->
    <span class="mirror" id="strip">reading…</span>
  </header>

  <div class="shell">
    <!-- DYNAMIC: everything below is rendered from the mirror on disk. The
         agent writes none of it — the phone owns the passes. -->
    <div class="left">
      <!-- The phone's doors, under the short names a tab strip has room for.
           A tab appears only when the mirror holds what is behind it. -->
      <nav class="tabs" id="tabs" aria-label="Health sections"></nav>
      <main class="main" id="main"></main>
    </div>
    <section id="chat-panel"></section>
  </div>

  <script type="module" src="health.js"></script>
  <script type="module" src="app-mode.js"></script>
</body>
</html>
