<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="h.set.title">Health — Settings</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="health.css" />
  <!-- Its engine calls ride the data channel, never plain HTTP (first, so
       every script below has it). -->
  <script src="/shared/channel.js"></script>
</head>
<body>
  <header class="top"><h1 data-i18n="h.set.title">Health — Settings</h1></header>
  <main class="main" id="main"></main>
  <script type="module">
    // Settings says what is true and offers only what this side actually
    // owns. The body data belongs to the phone; nothing here can change it.
    import { verb, runBash } from './bash.js';
    import { applyI18n, loadLanguage, t as tr } from './strings.js';

    await loadLanguage();
    applyI18n();

    const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
    const card = (title, ...kids) => { const c = el('section', 'card'); if (title) c.append(el('span', 'eyebrow', title)); kids.forEach((k) => k && c.append(k)); return c; };
    const row = (k, v, note) => { const r = el('div', 'row'); r.append(el('div', 'k', k)); const b = el('div', 'v'); b.append(el('div', null, v)); if (note) b.append(el('small', null, note)); r.append(b); return r; };

    const main = document.getElementById('main');
    try {
      const [l, cfg] = await Promise.all([
        verb('ledger'),
        runBash('cat "$HOME/.linggen/skills/health/config.json" 2>/dev/null || echo "{}"'),
      ]);
      const c = JSON.parse(cfg.trim() || '{}');
      const devices = Object.entries(l.devices || {});
      main.append(card(tr('h.set.mirror'),
        row(tr('h.set.where'), '~/.linggen/skills/health/data', tr('h.set.whereNote')),
        row(tr('h.set.holds'), tr('h.set.samples', { n: (l.held.samples || 0).toLocaleString() }), tr('h.set.typesSince', { n: l.held.types, since: (l.held.first || '—').slice(0, 10) })),
        row(tr('h.set.phones'), devices.length ? tr('h.set.sending', { n: devices.length }) : tr('h.set.nonePaired'),
          devices.length ? tr('h.set.lastHeard', { at: (devices[0][1].at || '').slice(0, 10) }) : tr('h.set.onlyIphone')),
        row(tr('h.set.identity'), l.mirror_id, tr('h.set.identityNote'))));
      main.append(card(tr('h.set.config'),
        row(tr('h.set.units'), c.units || 'metric', tr('h.set.unitsNote')),
        row(tr('h.set.workspaces'), (c.workspaces || []).join(', ') || tr('h.set.none'),
          tr('h.set.workspacesNote'))));
    } catch (e) {
      main.append(card(tr('h.somethingWentWrong'), el('p', 'err', String(e.message || e))));
    }
  </script>
</body>
</html>
