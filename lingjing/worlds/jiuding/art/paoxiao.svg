<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="bleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="mist" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="paper" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#F7F2E7"/><stop offset="1" stop-color="#EAE2D2"/>
    </radialGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".5" fill="#1E1B18" opacity=".05"/><circle cx="4" cy="4" r=".4" fill="#1E1B18" opacity=".04"/>
    </pattern>
  </defs>
  <rect width="360" height="220" fill="url(#paper)"/>
  <rect width="360" height="220" fill="url(#grain)"/>

  <!-- dusk sky wash and the shrine -->
  <rect x="0" y="0" width="360" height="120" fill="#1E1B18" opacity=".05"/>
  <g fill="#1E1B18" opacity=".22" filter="url(#bleed)">
    <path d="M250 96 L262 70 L322 70 L334 96 Z"/>
    <path d="M258 96 L258 118 L326 118 L326 96 Z"/>
    <path d="M244 70 Q292 56 340 70 L336 66 Q292 50 248 66 Z"/>
  </g>
  <path d="M292 60 Q300 40 290 30 Q282 20 292 8" fill="none" stroke="#1E1B18" stroke-width="1.2" opacity=".28" filter="url(#wash)"/>
  <!-- the river, heavy -->
  <path d="M0 132 Q90 122 180 134 T360 130 L360 220 L0 220Z" fill="#1E1B18" opacity=".18"/>
  <path d="M0 160 Q120 150 240 162 T360 158 L360 220 L0 220Z" fill="#1E1B18" opacity=".16" filter="url(#bleed)"/>
  <g fill="none" stroke="#1E1B18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3" opacity=".5">
    <path d="M14 146 Q40 142 66 146 M100 176 Q130 172 160 176 M260 148 Q290 144 320 148 M200 196 Q236 192 272 196"/>
  </g>
  <!-- the beast, climbing out of the river: a dark mass, wool scratched white -->
  <g transform="translate(70 30)">
    <!-- body -->
    <path d="M20 122 Q4 96 18 70 Q34 44 78 40 Q126 36 160 56 Q184 70 186 96 L188 126 L20 126 Z" fill="#1E1B18" opacity=".92" filter="url(#rough)"/>
    <path d="M30 118 Q18 96 30 76 Q46 54 84 50 Q124 46 154 64 Q172 76 176 98" fill="none" stroke="#1E1B18" stroke-width="3" opacity=".9"/>
    <!-- wool: white curls in the ink -->
    <g fill="none" stroke="#F4EFE4" stroke-width="1.5" stroke-linecap="round" opacity=".85">
      <path d="M40 70 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0"/>
      <path d="M32 86 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0"/>
      <path d="M36 102 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0"/>
      <path d="M60 56 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0"/>
      <path d="M140 80 q6 -8 12 0 q6 -8 12 0 M136 96 q6 -8 12 0 q6 -8 12 0"/>
    </g>
    <!-- the eyes under the arms: pale, open, wrong -->
    <g transform="translate(58 112)">
      <ellipse cx="0" cy="0" rx="8" ry="4.4" fill="#F7F2E7"/><circle cx="0" cy="0" r="2.2" fill="#1E1B18"/>
    </g>
    <g transform="translate(150 114)">
      <ellipse cx="0" cy="0" rx="8" ry="4.4" fill="#F7F2E7"/><circle cx="0" cy="0" r="2.2" fill="#1E1B18"/>
    </g>
    <!-- the neck and the man's face, rising at the front -->
    <path d="M160 58 Q176 36 196 30 Q206 44 200 62 Q186 70 168 66 Z" fill="#1E1B18" opacity=".92" filter="url(#rough)"/>
    <g transform="translate(206 26) rotate(8)">
      <path d="M-22 -2 Q-24 -32 0 -34 Q24 -32 22 -2 Q20 20 0 24 Q-20 20 -22 -2 Z" fill="#F7F2E7" stroke="#1E1B18" stroke-width="2" filter="url(#rough)"/>
      <path d="M-20 -16 Q0 -32 20 -16 Q12 -26 0 -25 Q-12 -26 -20 -16Z" fill="#1E1B18"/>
      <g fill="none" stroke="#1E1B18" stroke-width="1.4" stroke-linecap="round">
        <path d="M-13 -6 Q-8 -10 -2 -6 M2 -6 Q8 -10 13 -6"/>
        <path d="M-11 -3 Q-8 -1 -4 -3 M4 -3 Q8 -1 11 -3" stroke-width="1.1"/>
        <path d="M0 -2 L-2 7 L2 8"/>
        <path d="M-10 13 Q0 18 10 13"/>
        <path d="M-7 13 L-6 17 M-2.5 13 L-2.5 18 M2.5 13 L2.5 18 M7 13 L6 17"/>
      </g>
    </g>
    <!-- forelegs in the shallows, human nails -->
    <g fill="none" stroke="#1E1B18" stroke-width="4" stroke-linecap="round">
      <path d="M52 126 L48 146 M158 126 L164 146"/>
      <path d="M42 146 L54 146 M44 146 L43 153 M48 146 L48 154 M52 146 L53 153" stroke-width="1.5"/>
      <path d="M158 146 L170 146 M160 146 L159 153 M164 146 L164 154 M168 146 L169 153" stroke-width="1.5"/>
    </g>
    <!-- the water closing over the belly -->
    <path d="M0 128 Q60 122 120 128 T240 126 L240 140 L0 140Z" fill="#1E1B18" opacity=".22" filter="url(#bleed)"/>
    <path d="M6 132 Q40 128 74 132 M120 136 Q160 132 200 136" fill="none" stroke="#F7F2E7" stroke-width="1.4" opacity=".7"/>
  </g>
  <!-- reeds -->
  <g fill="none" stroke="#1E1B18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" opacity=".8">
    <path d="M330 218 Q336 190 330 166 M344 218 Q350 196 356 178 M12 218 Q18 194 10 170 M26 218 Q30 200 36 184"/>
  </g>

  <g transform="translate(30 190)">
    <rect x="-9" y="-9" width="18" height="18" rx="1.5" fill="#B03A2B" opacity=".92" filter="url(#rough)"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-family="'Songti SC','Noto Serif CJK SC',serif" fill="#F7F2E7">鸮</text>
  </g>
</svg>
