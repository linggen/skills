<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="bleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="mist" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="paper" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#F7F2E7"/><stop offset="1" stop-color="#EAE2D2"/>
    </radialGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".5" fill="#1E1B18" opacity=".05"/><circle cx="4" cy="4" r=".4" fill="#1E1B18" opacity=".04"/>
    </pattern>
  </defs>
  <rect width="360" height="220" fill="url(#paper)"/>
  <rect width="360" height="220" fill="url(#grain)"/>

  <!-- far mountains, two washes -->
  <path d="M0 118 L38 74 L62 92 L98 44 L134 86 L166 64 L206 104 L244 70 L282 96 L318 78 L360 92 L360 220 L0 220Z" fill="#1E1B18" opacity=".08" filter="url(#bleed)"/>
  <path d="M0 140 L48 112 L88 128 L128 100 L176 132 L222 110 L270 136 L312 116 L360 130 L360 220 L0 220Z" fill="#1E1B18" opacity=".13" filter="url(#bleed)"/>
  <!-- moon -->
  <circle cx="284" cy="46" r="17" fill="#1E1B18" opacity=".10" filter="url(#wash)"/>
  <circle cx="284" cy="46" r="15" fill="#F7F2E7" opacity=".9"/>
  <!-- mist bands -->
  <rect x="0" y="120" width="360" height="26" fill="#F7F2E7" opacity=".85" filter="url(#mist)"/>
  <rect x="40" y="150" width="300" height="18" fill="#F7F2E7" opacity=".7" filter="url(#mist)"/>
  <!-- water -->
  <path d="M0 176 Q60 170 120 176 T240 176 T360 174 L360 220 L0 220Z" fill="#1E1B18" opacity=".07"/>
  <g fill="none" stroke="#1E1B18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.1" opacity=".35">
    <path d="M30 190 Q60 186 90 190 M150 200 Q190 196 230 200 M270 188 Q300 184 330 188 M120 208 Q140 206 160 208"/>
  </g>
  <!-- the deer: white body edged with a brush line, standing on the water -->
  <g transform="translate(140 84) scale(1.3)">
    <ellipse cx="34" cy="74" rx="44" ry="6" fill="#1E1B18" opacity=".16" filter="url(#wash)"/>
    <path d="M6 22 Q22 14 40 18 L46 8 Q50 2 56 4 L60 12 L54 20 L50 36 L52 70 L48 70 L46 44 L36 42 L18 42 L14 70 L10 70 L8 46 Q0 36 6 22 Z" fill="#FBF8F2" stroke="#1E1B18" stroke-width="1.6" stroke-linejoin="round" filter="url(#rough)"/>
    <g fill="none" stroke="#1E1B18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
      <path d="M46 44 L44 70 M18 42 L20 70"/>
      <path d="M8 46 Q4 40 6 26" stroke-width="2.2"/>
      <path d="M52 70 L54 74 M14 70 L12 74 M46 70 L48 74 M20 70 L18 74" stroke-width="2.6"/>
    </g>
    <!-- four antlers -->
    <g fill="none" stroke="#1E1B18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path d="M50 6 Q42 -4 38 -12 M44 -2 L38 -3 M42 -6 L44 -12"/>
      <path d="M52 5 Q50 -6 49 -14 M50 -6 L46 -10 M50 -10 L53 -15"/>
      <path d="M56 5 Q58 -6 61 -14 M58 -6 L62 -9 M59 -10 L57 -15"/>
      <path d="M58 6 Q66 -2 72 -8 M64 0 L68 2 M67 -3 L70 -8"/>
    </g>
    <circle cx="54" cy="9" r="1.4" fill="#1E1B18"/>
    <path d="M60 12 L62 13" stroke="#1E1B18" stroke-width="1.2"/>
  </g>
  <!-- reeds, foreground -->
  <g fill="none" stroke="#1E1B18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6">
    <path d="M20 218 Q26 190 22 168 M30 218 Q34 196 40 176 M44 218 Q42 192 50 180" opacity=".8"/>
    <path d="M320 218 Q324 194 316 172 M332 218 Q340 198 336 182 M346 218 Q344 200 352 186" opacity=".8"/>
    <path d="M22 168 L18 160 M40 176 L44 168 M316 172 L312 164" stroke-width="2.4" opacity=".6"/>
  </g>

  <g transform="translate(330 190)">
    <rect x="-9" y="-9" width="18" height="18" rx="1.5" fill="#B03A2B" opacity=".92" filter="url(#rough)"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-family="'Songti SC','Noto Serif CJK SC',serif" fill="#F7F2E7">诸</text>
  </g>
</svg>
