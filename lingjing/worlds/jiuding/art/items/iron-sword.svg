<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="bleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="mist" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="paper" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#F7F2E7"/><stop offset="1" stop-color="#EAE2D2"/>
    </radialGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".5" fill="#1E1B18" opacity=".05"/><circle cx="4" cy="4" r=".4" fill="#1E1B18" opacity=".04"/>
    </pattern>
  </defs>
  <rect width="160" height="120" fill="url(#paper)"/>
  <rect width="160" height="120" fill="url(#grain)"/>

  <path d="M20 104 L108 16" stroke="#1E1B18" stroke-width="8" stroke-linecap="butt" filter="url(#rough)"/>
  <path d="M22 100 L106 16" stroke="#F7F2E7" stroke-width="1.4" opacity=".55"/>
  <path d="M18 106 L110 14" stroke="#1E1B18" stroke-width="1.2" opacity=".6"/>
  <g fill="none" stroke="#1E1B18" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <path d="M100 30 L122 18 M112 42 L126 22" stroke-width="2.6"/>
    <path d="M104 22 L118 36" stroke-width="5"/>
    <path d="M116 30 L134 12" stroke-width="4"/>
    <circle cx="138" cy="8" r="4" stroke-width="2.2"/>
  </g>

  <g transform="translate(140 100)">
    <rect x="-9" y="-9" width="18" height="18" rx="1.5" fill="#B03A2B" opacity=".92" filter="url(#rough)"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-family="'Songti SC','Noto Serif CJK SC',serif" fill="#F7F2E7">铁</text>
  </g>
</svg>
