<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="bleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="mist" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="paper" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#F7F2E7"/><stop offset="1" stop-color="#EAE2D2"/>
    </radialGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".5" fill="#1E1B18" opacity=".05"/><circle cx="4" cy="4" r=".4" fill="#1E1B18" opacity=".04"/>
    </pattern>
  </defs>
  <rect width="360" height="220" fill="url(#paper)"/>
  <rect width="360" height="220" fill="url(#grain)"/>

  <!-- the mountain, left, in wash -->
  <path d="M0 150 L30 96 L58 118 L86 70 L118 122 L140 108 L160 150 Z" fill="#1E1B18" opacity=".18" filter="url(#bleed)"/>
  <path d="M0 160 L40 130 L70 146 L100 118 L134 152 L160 160 Z" fill="#1E1B18" opacity=".12" filter="url(#bleed)"/>
  <!-- cudrania trees on the ridge -->
  <g fill="none" stroke="#1E1B18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" opacity=".7">
    <path d="M86 70 L86 60 M82 64 L90 60 M84 58 L88 54 M118 122 L118 112 M114 116 L122 112"/>
  </g>
  <!-- sun, faint -->
  <circle cx="300" cy="50" r="14" fill="#B03A2B" opacity=".16" filter="url(#wash)"/>
  <!-- the sea -->
  <path d="M0 170 Q40 160 80 170 T160 170 T240 170 T320 170 T400 170 L360 220 L0 220Z" fill="#1E1B18" opacity=".1"/>
  <g fill="none" stroke="#1E1B18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" opacity=".6">
    <path d="M20 180 q12 -8 24 0 q12 -8 24 0 M130 186 q12 -8 24 0 q12 -8 24 0 q12 -8 24 0 M250 178 q12 -8 24 0 q12 -8 24 0 q12 -8 24 0"/>
    <path d="M60 200 q12 -8 24 0 q12 -8 24 0 M200 206 q12 -8 24 0 q12 -8 24 0 M300 198 q12 -8 24 0 q12 -8 24 0"/>
  </g>
  <path d="M40 176 L52 172 M180 184 L190 178 M290 176 L302 172" stroke="#F7F2E7" stroke-width="2" opacity=".9"/>
  <!-- the bird, flying east -->
  <g transform="translate(172 70)">
    <!-- wings: heavy strokes -->
    <path d="M10 22 Q-30 0 -66 -14 Q-30 6 -2 30 Z" fill="#1E1B18" opacity=".9" filter="url(#rough)"/>
    <path d="M30 20 Q60 -18 96 -34 Q66 -4 40 30 Z" fill="#1E1B18" opacity=".82" filter="url(#rough)"/>
    <!-- body -->
    <path d="M0 30 Q16 14 40 22 Q56 28 50 42 Q34 54 8 46 Q-6 40 0 30 Z" fill="#1E1B18" filter="url(#rough)"/>
    <!-- tail -->
    <path d="M6 44 L-14 60 L-4 50 L-16 52 L2 46 Z" fill="#1E1B18" opacity=".9"/>
    <!-- patterned head -->
    <path d="M40 22 Q50 8 64 14 Q72 20 66 30 Q56 36 46 30 Z" fill="#1E1B18"/>
    <circle cx="52" cy="18" r="1.6" fill="#F7F2E7"/><circle cx="59" cy="15" r="1.3" fill="#F7F2E7"/><circle cx="57" cy="23" r="1.2" fill="#F7F2E7"/><circle cx="48" cy="25" r="1" fill="#F7F2E7"/>
    <circle cx="61" cy="20" r="1.8" fill="#F7F2E7"/><circle cx="61.5" cy="20" r="1" fill="#1E1B18"/>
    <!-- white beak with the pebble -->
    <path d="M66 22 L84 26 L66 28 Z" fill="#F7F2E7" stroke="#1E1B18" stroke-width="1"/>
    <circle cx="86" cy="27" r="3.2" fill="#1E1B18" opacity=".75"/>
    <!-- red feet, tucked -->
    <g fill="none" stroke="#B03A2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 48 L24 56 L20 60 M24 56 L28 60 M34 48 L36 56 L32 60 M36 56 L40 60"/>
    </g>
  </g>

  <g transform="translate(30 190)">
    <rect x="-9" y="-9" width="18" height="18" rx="1.5" fill="#B03A2B" opacity=".92" filter="url(#rough)"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-family="'Songti SC','Noto Serif CJK SC',serif" fill="#F7F2E7">卫</text>
  </g>
</svg>
