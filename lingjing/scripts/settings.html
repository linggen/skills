<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵境 · 设置</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <!-- Its engine calls ride the data channel (first, so every script below has it). -->
  <script src="/shared/channel.js"></script>
  <!-- The app shell's Settings (/shared/app-mode.js loads this page into its overlay). One row today: the play log
       (数据埋点, rules/analytics.mjs) — what it keeps in one line, and its switch. -->
  <style>
    :root { --paper: #f6efe2; --ink: #2b241c; --mute: #7a6d5c; --line: #d8cbb4; --seal: #a8382a; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #1d1a16; --ink: #ece3d3; --mute: #a39784; --line: #3a342b; --seal: #d0604e; } }
    :root[data-theme="dark"] { --paper: #1d1a16; --ink: #ece3d3; --mute: #a39784; --line: #3a342b; --seal: #d0604e; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 "Songti SC", "Noto Serif SC", serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 18px; font-weight: 600; letter-spacing: .12em; margin: 0 0 18px; }
    .row { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .row div { flex: 1; }
    .row b { display: block; font-weight: 600; }
    .row small { color: var(--mute); font-size: 13px; }
    button { font: inherit; font-size: 14px; padding: 4px 14px; border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 3px; cursor: pointer; min-width: 64px; }
    button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .err { color: var(--seal); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">灵境 · 设置</h1>
    <div class="row">
      <div><b id="name">游戏记录</b><small id="line"></small></div>
      <button type="button" id="sw" aria-pressed="false">…</button>
    </div>
    <p class="err" id="err" hidden></p>
  </main>
  <script type="module">
    import { verb } from './rules.js';
    const en = !/^zh/i.test(navigator.language || 'zh');
    const W = en
      ? { title: 'Lingjing · Settings', name: 'Play log', line: 'Play times and results, kept on this Mac only — never uploaded.', on: 'On', off: 'Off' }
      : { title: '灵境 · 设置', name: '游戏记录', line: '只记游玩时长和输赢，存在本机，从不上传。', on: '开', off: '关' };
    document.documentElement.lang = en ? 'en' : 'zh';
    document.getElementById('title').textContent = W.title;
    document.getElementById('name').textContent = W.name;
    document.getElementById('line').textContent = W.line;
    const sw = document.getElementById('sw'), err = document.getElementById('err');
    const paint = (off) => { sw.setAttribute('aria-pressed', String(!off)); sw.textContent = off ? W.off : W.on; };
    const call = async (args) => {
      try { const r = await verb('track', args); err.hidden = true; return r; } catch (e) { err.hidden = false; err.textContent = String(e.message || e); return null; }
    };
    let off = Boolean((await call({ action: 'status' }))?.off);
    paint(off);
    sw.addEventListener('click', async () => {
      const r = await call({ action: off ? 'on' : 'off' });
      if (r?.ok) { off = Boolean(r.off); paint(off); }
    });
  </script>
</body>
</html>
