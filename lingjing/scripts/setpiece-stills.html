<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵境 · 场面静帧</title>
  <link rel="stylesheet" href="lingjing.css" />
  <style>
    body { overflow: auto; padding: 16px; background: var(--paper, #f4efe4); }
    .stills { max-width: 1100px; margin: 0 auto; }
    .stills h1 { font-family: var(--serif, serif); font-size: 20px; margin: 0 0 4px; }
    .stills .sub { font-size: 13px; opacity: .7; margin: 0 0 20px; }
    .still { margin: 0 0 36px; }
    .still img { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,.18); }
    .still .n { font-size: 12px; opacity: .6; margin: 10px 0 2px; }
    .still p { font-family: var(--serif, serif); font-size: 16px; line-height: 1.8; margin: 0; }
  </style>
</head>
<body>
  <!-- Stills for a set piece, for review before any animation: ?name=zhang&lang=zh|en -->
  <div class="stills">
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div id="list"></div>
  </div>
  <script type="module">
    const SETS = {
      zhang: {
        title: { zh: '第十回 · 漳水立起 — 静帧', en: 'Chapter 10 · The River Stands — stills' },
        frames: [
          { f: 'zhang-a', zh: '话音未落，漳水竟站了起来。不是涨，是站——一整条河从河床上立起来，立成了一道墙。水墙里千千万万尾鱼……全朝着一个方向，一尾接一尾地往上跃，倒像是整条漳水，都在跳一道看不见的龙门。……河床便露了出来：泥，水草，一只一只的木船，横七竖八地陷在淤泥里，船底都凿着洞。',
            en: 'The Zhang stood up — not rising, standing: a whole river lifted off its bed into a wall, ten thousand fish in it leaping one way, as if the river were leaping an unseen Dragon Gate; below, the bare bed, and the holed boats sunk in the mud.' },
          { f: 'zhang-b', zh: '水墙正中，那片最深的黑水里，慢慢浮上来一个人影：人的脸，披着水做的衣裳，脚底下踩着两条龙，都是青的，鳞片有磨盘那么大，一左一右托着他，缓缓升到半空。',
            en: 'From the deepest black water at the heart of the wall a figure rose: a human face, a robe of water, two green dragons with scales like millstones bearing him up, one on each side.' },
          { f: 'zhang-c', zh: '他往后退了两步，退到豆腐西施跟前，转过身来，背对着她，两条胳膊一张，挡在了两条龙的正中间。……两颗比灶屋还大的龙头，在他面前一尺的地方停住了。「……她是卖豆腐的。她没招谁。」',
            en: 'He stepped back to the tofu girl, turned his back to her, and spread his arms between the two dragons. Two heads bigger than a kitchen stopped a foot from his face. "She sells tofu. She never wronged anyone."' },
          { f: 'zhang-e', zh: '坑底便是那口鼎。四四方方，四只脚，两只耳朵直直地竖着，大得能装下一间屋子，半截陷在淤泥里。……鼎口上压着一块石板，石板上凿着九个方格，三三一排，中间那一格凿得最深。',
            en: 'At the bottom lay the cauldron: square, four legs, two ears standing straight up, big as a house, half sunk in silt. On its mouth, a slab cut with nine squares, three by three, the middle one deepest.' },
          { f: 'zhang-f', zh: '小满浮上水面的时候，日头已经落尽了，天边只剩一抹暗红。那口鼎跟着他浮了上来，越浮越小……落在他手心里，沉甸甸的，暖的。……东边的月亮也升了起来。',
            en: 'When he surfaced the sun had set, only a streak of dark red left; the cauldron rose after him, growing smaller and smaller, and dropped into his palm, heavy and warm. In the east the moon came up.' },
        ],
      },
    };
    const q = new URLSearchParams(location.search);
    const set = SETS[q.get('name') || 'zhang'] || SETS.zhang;
    const lang = q.get('lang') === 'en' ? 'en' : 'zh';
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    document.getElementById('title').textContent = set.title[lang];
    document.getElementById('sub').textContent = lang === 'zh' ? '只有静帧，还没有动画。' : 'Stills only — no animation yet.';
    document.getElementById('list').innerHTML = set.frames.map((x, i) =>
      `<div class="still"><img src="../worlds/jiuding/art/setpiece/${x.f}.webp" alt="" loading="lazy" /><div class="n">${i + 1} / ${set.frames.length}</div><p>${esc(x[lang])}</p></div>`).join('');
  </script>
</body>
</html>
