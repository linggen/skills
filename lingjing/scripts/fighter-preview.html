<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>格斗 · 画帧预览</title>
<style>
  body { margin: 0; background: #e9dcc0; font: 15px "Songti SC", "STSong", serif; color: #1c1a16; }
  header { padding: 14px 18px 4px; }
  header b { font-size: 20px; }
  header small { display: block; opacity: .7; margin-top: 4px; }
  header a { color: inherit; margin-right: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px 18px; }
  figure { margin: 0; background: #f1e9d6; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,.08); }
  figcaption { padding: 6px 10px; font-size: 14px; }
  canvas { display: block; width: min(92vw, 300px); height: auto; }
  .sheet { padding: 0 18px 24px; }
  .sheet canvas { width: auto; height: 160px; display: inline-block; margin: 4px; background: #efe5cd; border-radius: 6px; }
</style>
</head>
<body>
<!-- A builder's page (?dev=1), never linked in the game: a fighter's painted clips played at the board's speed, each
     clip on its loop, and every frame of the sheet. Frames: art/games/fighter/<who>.webp + .json (tools/fighter-frames.py);
     the board plays them through fighter/draw.js (frameOf). ?who=qinyan | xiaoman. -->
<header><b>格斗 · 画帧预览</b><small><a href="?dev=1&who=qinyan">秦雁</a><a href="?dev=1&who=xiaoman">沈小满</a>每段动作按游戏的帧速循环；下面是整张画帧。</small></header>
<div class="row" id="row"></div>
<div class="sheet" id="sheet"></div>
<script type="module">
import { frameOf } from './games/fighter/draw.js';
const q = new URLSearchParams(location.search);
const row = document.getElementById('row');
if (q.get('dev') !== '1') row.textContent = '—';
else {
  const who = (q.get('who') || 'qinyan').replace(/[^a-z]/g, '');
  const base = new URL(`../worlds/jiuding/art/games/fighter/${who}`, import.meta.url).href;
  const sheetJson = new URL(`${base}.json`);
  const meta = await fetch(sheetJson).then((r) => r.json());
  const img = new Image();
  await new Promise((ok) => { img.onload = ok; img.onerror = ok; img.src = `${base}.webp`; });
  const W = 300, H = 300, K = 2, u = 250 / meta.stand;
  const put = (g, name, x, y) => {
    const f = meta.frames[name]; if (!f) return;
    g.drawImage(img, f.rect[0], f.rect[1], f.rect[2], f.rect[3], x - f.anchor[0] * u, y - f.anchor[1] * u, f.rect[2] * u, f.rect[3] * u);
  };
  const views = Object.entries(meta.clips).map(([name, clip]) => {
    const fig = document.createElement('figure');
    const c = document.createElement('canvas'); c.width = W * K; c.height = H * K;
    const cap = document.createElement('figcaption'); cap.textContent = `${name} · ${clip.frames.length} 帧 · ${clip.fps} fps`;
    fig.append(c, cap); row.append(fig);
    // a one-shot clip plays once, holds its last frame, and starts again
    const once = clip.frames.length * 1000 / (clip.fps ?? 8);
    return { clip, g: c.getContext('2d'), period: clip.loop ? 1e9 : once + 700 };
  });
  const t0 = performance.now();
  const frame = (now) => {
    for (const v of views) {
      const g = v.g; g.setTransform(K, 0, 0, K, 0, 0);
      g.fillStyle = '#f3ecd9'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#9aa19a'; g.fillRect(0, H - 30, W, 6); g.fillStyle = '#5e645e'; g.fillRect(0, H - 24, W, 24);
      put(g, frameOf(v.clip, (now - t0) % v.period), W * 0.4, H - 30);
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `<h3>全部画帧 · ${Object.keys(meta.frames).length}</h3>`;
  for (const name of Object.keys(meta.frames)) {
    const c = document.createElement('canvas'); c.width = 240; c.height = 320; c.title = name;
    const g = c.getContext('2d'); put(g, name, 100, 300); g.fillStyle = '#000'; g.font = '14px serif'; g.fillText(name, 4, 16);
    sheet.append(c);
  }
}
</script>
</body>
</html>
