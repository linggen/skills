<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>灵境 · 试玩</title>
  <link rel="stylesheet" href="lingjing.css" />
  <link rel="stylesheet" href="games/luoshu.css" />
  <link rel="stylesheet" href="games/huarong.css" />
  <link rel="stylesheet" href="games/qiqiao.css" />
  <link rel="stylesheet" href="games/wuziqi.css" />
  <link rel="stylesheet" href="games/xiangqi.css" />
  <link rel="stylesheet" href="games/live.css" />
  <link rel="stylesheet" href="games/shell.css" />
  <style>
    body { overflow: auto; padding: 16px; }
    .try { max-width: 440px; margin: 0 auto; }
    .try nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 14px; font-size: 13px; }
    .try nav a { color: var(--ling); }
  </style>
</head>
<body>
  <!-- One small game, alone, through its mount() contract (games/mount.js) — for trying it by hand.
       A test page, never linked in the game: it opens only with ?dev=1.
       ?dev=1&game=rain|deer|…&lang=zh|en&seed=… — nothing is saved and nothing is paid. The 游戏厅
       (arcade.html?dev=1) lists them all. -->
  <div class="try" id="try"></div>
  <script type="module">
    import { mountPure } from './games/mount.js';
    import { playAlone, timedOf } from './games/shell.js';
    const q = new URLSearchParams(location.search);
    const root = document.getElementById('try');
    if (q.get('dev') !== '1') root.textContent = '—';
    else {
      const id = (q.get('game') || 'rain').replace(/[^a-z]/g, '');
      const lang = q.get('lang') === 'en' ? 'en' : 'zh';
      const mod = await import(`./games/${id}.js`);
      const mount = mod.mount ?? mountPure(mod);
      root.innerHTML = `<nav><a href="arcade.html?dev=1${lang === 'en' ? '&lang=en' : ''}">游戏厅</a>`
        + `<a href="?dev=1&game=${id}&lang=${lang === 'en' ? 'zh' : 'en'}">${lang === 'en' ? '中' : 'En'}</a><a href="?dev=1&game=${id}&lang=${lang}">↺</a></nav><div id="play"></div>`;
      // &data=<json>: the deal a story or daily board would hand it (a 饭桶 tool day: {"els":[…],"must":"spring"}) — tools/play-human.mjs.
      let data;
      try { data = q.get('data') ? JSON.parse(q.get('data')) : undefined; } catch { data = undefined; }
      // The one shell every small game wears (games/shell.js): title and how-to in its bar, the result and 再来 under it.
      playAlone(document.getElementById('play'), mount, {
        id: `try-${id}`, title: mod.meta?.name?.[lang] ?? id, how: mod.meta?.how?.[lang] ?? '', timed: timedOf(mod), lang,
        opts: { data, seed: q.get('seed') || String(Date.now()), level: Number(q.get('level') || 1) },
      });
    }
  </script>
</body>
</html>
