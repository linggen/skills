<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵境 · 试玩</title>
  <link rel="stylesheet" href="lingjing.css" />
  <link rel="stylesheet" href="games/luoshu.css" />
  <link rel="stylesheet" href="games/huarong.css" />
  <link rel="stylesheet" href="games/qiqiao.css" />
  <link rel="stylesheet" href="games/shouye.css" />
  <link rel="stylesheet" href="games/live.css" />
  <style>
    body { overflow: auto; padding: 16px; }
    .try { max-width: 420px; margin: 0 auto; }
    .try h1 { font-family: var(--serif); font-size: 18px; margin: 0 0 4px; }
    .try nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 14px; font-size: 13px; }
    .try nav a { color: var(--ling); }
    .try .won { margin-top: 12px; color: var(--ling); font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <!-- One game module, alone, for trying it by hand: ?game=storm|deer|xisui|zhoutian|luoshu…&lang=zh|en&seed=…
       Nothing is saved and nothing is paid; the page only draws the module and runs it. -->
  <div class="try">
    <h1 id="title">…</h1>
    <div class="small dim" id="how"></div>
    <nav id="nav"></nav>
    <div class="game" id="host"></div>
    <div class="won" id="won"></div>
  </div>
  <script type="module">
    import { wireLiveGames } from './live-games.js';
    const q = new URLSearchParams(location.search);
    const id = (q.get('game') || 'storm').replace(/[^a-z]/g, '');
    const lang = () => (q.get('lang') === 'en' ? 'en' : 'zh');
    const seed = q.get('seed') || String(Date.now());
    const mod = await import(`./games/${id}.js`);
    const host = document.getElementById('host');
    host.dataset.game = `try:${id}`;
    const g = { taskId: `try:${id}`, mod, state: mod.newGame(seed, Number(q.get('level') || 1)), sent: false };
    const paint = () => { host.innerHTML = mod.html(g.state, lang()); };
    const onWon = () => { g.sent = true; document.getElementById('won').textContent = lang() === 'en' ? '— won (the page would now send the win) —' : '——胜（游戏里此刻会把胜局交给规则）——'; };
    document.getElementById('title').textContent = mod.meta.name[lang()];
    document.getElementById('how').textContent = mod.meta.how[lang()];
    document.getElementById('nav').innerHTML = ['storm', 'deer', 'xisui', 'zhoutian'].map((k) => `<a href="?game=${k}&lang=${lang()}">${k}</a>`).join('')
      + `<a href="?game=${id}&lang=${lang() === 'en' ? 'zh' : 'en'}">${lang() === 'en' ? '中' : 'En'}</a><a href="?game=${id}&lang=${lang()}">↺</a>`;
    host.addEventListener('click', (e) => {
      const el = e.target.closest('[data-g]');
      if (!el || el.disabled) return;
      const r = mod.act(g.state, { ...el.dataset });
      g.state = r.state; paint();
      if (r.won && !g.sent) onWon();
    });
    wireLiveGames({ boardFor: () => g, lang, onWon: () => onWon() });
    paint();
  </script>
</body>
</html>
