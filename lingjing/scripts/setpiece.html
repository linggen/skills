<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵境 · 大场面</title>
  <link rel="stylesheet" href="lingjing.css" />
  <link rel="stylesheet" href="setpiece.css" />
  <style>
    body { overflow: auto; padding: 16px; background: #efe8d8; }
    .spv { max-width: 860px; width: 100%; margin: 0 auto; box-sizing: border-box; }
    .spv h1 { font-family: var(--serif, serif); font-size: 18px; margin: 0 0 4px; }
    .spv .spstage { width: 100%; aspect-ratio: 4 / 3; cursor: pointer; }
    @media (max-width: 600px) { .spv .spstage { aspect-ratio: 4 / 5; } }
    .spv .line { min-height: 3.4em; margin: 12px 2px 8px; font-family: var(--serif, serif); font-size: 16px; line-height: 1.7; color: #231f1a; }
    .spv .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; }
    .spv .bar button { padding: 6px 12px; border-radius: 6px; border: 1px solid #8f8a80; background: #f5efe1; color: #231f1a; font: inherit; cursor: pointer; }
    .spv .bar .dim { margin-left: auto; color: #6f6a60; }
  </style>
</head>
<body>
  <!-- A set piece alone, to watch before a scene is wired to it:
       ?name=zhang&lang=zh|en&auto=1&still=1. Nothing is saved; the page only plays the piece. -->
  <div class="spv">
    <h1 id="title">…</h1>
    <div class="spstage" id="stage" title="点一下：下一段"></div>
    <div class="line" id="line"></div>
    <div class="bar">
      <button id="next">下一段 ›</button><button id="skip">跳过</button><button id="again">重播</button><button id="auto">自动</button>
      <span class="dim" id="count"></span>
    </div>
  </div>
  <script>
    // ?raf=timeout: a browser that parks requestAnimationFrame (a tab driven by a test harness) still plays.
    if (new URLSearchParams(location.search).get('raf') === 'timeout') {
      window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
      window.cancelAnimationFrame = (id) => clearTimeout(id);
    }
  </script>
  <script type="module">
    import { playSetPiece } from './setpiece.js';
    const q = new URLSearchParams(location.search);
    const name = (q.get('name') || 'zhang').replace(/[^a-z]/g, '');
    const lang = q.get('lang') === 'en' ? 'en' : 'zh';
    const still = q.get('still') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
    let auto = q.get('auto') === '1';
    const def = await import(`./setpieces/${name}.js`);
    const $ = (id) => document.getElementById(id);
    $('title').textContent = def.TITLE?.[lang] ?? name;
    const W = { zh: { next: '下一段 ›', skip: '跳过', again: '重播', auto: '自动', end: '（完。这里接银月的记忆与鼎归。）' }, en: { next: 'Next ›', skip: 'Skip', again: 'Replay', auto: 'Auto', end: '(End. Her memory and the homing play next.)' } }[lang];
    for (const k of ['next', 'skip', 'again', 'auto']) $(k).textContent = W[k];
    let ctl = null;
    const start = async () => {
      ctl?.destroy();
      $('line').textContent = '';
      ctl = await playSetPiece($('stage'), name, {
        lang, still, auto,
        onBeat: (i, b) => { $('line').textContent = b.text; $('count').textContent = `${i + 1} / ${def.BEATS.length} · ${b.id}`; },
        onDone: () => { $('line').textContent += ` ${W.end}`; },
      });
      window.__sp = ctl;
    };
    $('stage').addEventListener('click', () => ctl?.tap());
    $('next').addEventListener('click', () => ctl?.tap());
    $('skip').addEventListener('click', () => ctl?.skip());
    $('again').addEventListener('click', start);
    $('auto').addEventListener('click', () => { auto = !auto; $('auto').style.fontWeight = auto ? '700' : ''; start(); });
    if (auto) $('auto').style.fontWeight = '700';
    start();
  </script>
</body>
</html>
