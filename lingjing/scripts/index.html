<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵境 · Lingjing</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="lingjing.css" />
  <link rel="stylesheet" href="battle.css" />
  <link rel="stylesheet" href="battle-party.css" />
  <link rel="stylesheet" href="danang.css" />
  <link rel="stylesheet" href="card-reveal.css" />
  <link rel="stylesheet" href="memory.css" />
  <link rel="stylesheet" href="codex.css" />
  <link rel="stylesheet" href="inkmap.css" />
  <link rel="stylesheet" href="setpiece.css" />
  <link rel="stylesheet" href="story.css" />
  <link rel="stylesheet" href="games/luoshu.css" />
  <link rel="stylesheet" href="games/huarong.css" />
  <link rel="stylesheet" href="games/qiqiao.css" />
  <link rel="stylesheet" href="games/wuziqi.css" />
  <link rel="stylesheet" href="games/xiangqi.css" />
  <link rel="stylesheet" href="games/live.css" />
  <link rel="stylesheet" href="games/mishi.css" />
  <!-- The phone (2026-10-15): last, so its narrow rules stand over the rest. -->
  <link rel="stylesheet" href="phone.css" />
</head>
<body>
  <div class="shell">
    <!-- The scene: everything here is drawn from the rules' Look and the
         authored content. Ling moves it with Show; the rules own the numbers. -->
    <section class="scene" aria-label="Scene">
      <!-- A thin paper bar (Hanli, 2026-10-14, the approved prototypes): who he is, the 回
           and the place, then the people here as small faces (a tap opens their 图鉴) and
           the goal; a narrow scene folds it onto a second line. -->
      <header class="topbar"><div class="status" id="status"></div><div class="titlerow"><span class="huiline" id="huiLine"></span><span class="place" id="place"></span></div><div class="placecap" id="placeCap"></div><div class="headcards" id="headCards"></div></header>
      <div class="view" id="view">
        <!-- The backdrop (2026-10-14): the whole stage, a painting of the weather — the
             scene's own sky, else the real one — by day or night (worlds/<w>/backdrops.json),
             or the scene's own picture (`backdrop`); a set piece's beat lays its own over it.
             Darkened toward the foot, where the lines are. lingjing.js paintBackdrop. -->
        <div class="backdrop" id="backdrop" aria-hidden="true"></div>
        <div class="shade" aria-hidden="true"></div>
        <!-- Yinyue: her name and the ask button, a chip in the header's corner —
             no 3D body in the game (his, 2026-09-29) and no stand-in orb
             (his, 2026-09-30); her voice frame stays hidden here. -->
        <div class="stage" id="stage" hidden><div class="body" aria-hidden="true"></div><b id="stageName"></b><iframe id="herVoice" title="Yinyue" hidden></iframe><button class="act quiet askher" id="askHerBtn" data-ask-her hidden></button></div>
        <!-- 此刻: MAIN (#focus) holds ONE thing (stage.mjs stageSlots); HEADER — the people,
             the goal — is the top bar's (#headCards). -->
        <div class="slots">
          <div class="focus" id="focus"></div>
        </div>
        <!-- 初见 (sight.js): a face's first coming-on, large on the stage, then into the header. -->
        <div class="sight" id="sight"></div>
        <!-- The story (dialogue.js storyHtml, lines.js): the book's passage over the whole
             stage, a sentence at a time; the choices stand on it at the passage's end. -->
        <div class="dlgwrap" id="dlg"></div>
        <!-- 真实世界: a festival's dressing and the day's weather, one layer
             over the stage (atmos.js). Faint, and never in the way. -->
        <div class="atmos" id="atmos" aria-hidden="true"><div class="frame"><i class="fl"></i><i class="fr"></i><i class="ft"></i><i class="la"></i><i class="lb"></i></div><div id="atmosPts"></div></div>
      </div>
      <!-- 九鼎录: the 录 chip's book, in the stage's place while it is open. -->
      <div class="lubook" id="lubook" hidden></div>
      <!-- 储物袋: the chip's panel — what he wears and carries — likewise over the stage. -->
      <div class="lubook pouchbook" id="pouchbook" hidden></div>
      <!-- 行: the roads, what else waits, the chips; the ask bar opens over it. -->
      <footer class="slotfoot" id="slotFoot"><div class="footrow" id="footRow"></div><div class="footchips" id="footChips"></div><div class="askbar" id="askbar" hidden></div></footer>
      <div class="tray"><div class="traytitle" id="trayTitle"></div><div id="tray"></div></div>
    </section>
    <section id="chat-panel"></section>
  </div>
  <script type="module" src="lingjing.js"></script>
</body>
</html>
