<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>守炉</title>
<style>
:root{
  --bg:#ece3cf; --panel:#f6efdf; --ink:#2a241d; --ink-soft:#6f6252; --line:#cbbd9f;
  --zhusha:#b0412e; --zheshi:#9c5f2e; --huaqing:#3c6478; --gold:#9a7418;
  --btn:#fbf6ea; --btn-ink:#2a241d; --primary:#2a241d; --primary-ink:#f6efdf; --shadow:rgba(60,45,25,.18);
  --overlay:rgba(243,234,216,.86);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1815; --panel:#25221e; --ink:#ece2cd; --ink-soft:#a99c86; --line:#3d372f;
    --zhusha:#d9664f; --zheshi:#c98b55; --huaqing:#7fa9bd; --gold:#d6b052;
    --btn:#2c2823; --btn-ink:#ece2cd; --primary:#e1d1ad; --primary-ink:#1a1815; --shadow:rgba(0,0,0,.45);
    --overlay:rgba(26,24,21,.86);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1815; --panel:#25221e; --ink:#ece2cd; --ink-soft:#a99c86; --line:#3d372f;
  --zhusha:#d9664f; --zheshi:#c98b55; --huaqing:#7fa9bd; --gold:#d6b052;
  --btn:#2c2823; --btn-ink:#ece2cd; --primary:#e1d1ad; --primary-ink:#1a1815; --shadow:rgba(0,0,0,.45);
  --overlay:rgba(26,24,21,.86);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{max-width:680px;margin:0 auto;padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.hud h1{font-size:20px;margin:0 6px 0 0;letter-spacing:4px;font-weight:700;white-space:nowrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.stat b{font-size:16px;font-variant-numeric:tabular-nums}
.stat.fire b{color:var(--zhusha)} .stat.stone b{color:var(--gold)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.xi{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.xi-bar{flex:1;height:8px;border-radius:4px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
#xiFill{height:100%;width:0;background:linear-gradient(90deg,var(--zheshi),var(--zhusha));transition:width .6s}
#stage{position:relative;align-self:center;touch-action:manipulation}
canvas{display:block;border-radius:10px;box-shadow:0 2px 14px var(--shadow);touch-action:manipulation;cursor:pointer}
.preview{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);min-height:24px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 8px 1px 3px;color:var(--ink)}
.chip img{width:22px;height:22px}
.controls{display:flex;gap:8px}
button{font-family:inherit;font-size:15px;border-radius:10px;border:1px solid var(--line);background:var(--btn);color:var(--btn-ink);padding:9px 12px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);flex:1;font-weight:700}
.menu{position:absolute;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px var(--shadow);padding:8px;width:204px}
.menu.hidden{display:none}
.menu .title{font-size:14px;font-weight:700;margin:0 2px 6px;display:flex;justify-content:space-between}
.menu .title span{font-weight:400;color:var(--ink-soft);font-size:12px}
.menu .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.menu .opt{display:flex;flex-direction:column;align-items:flex-start;padding:6px 8px;border-radius:9px;font-size:14px;gap:1px;text-align:left}
.menu .opt .g{font-size:15px;font-weight:700}
.menu .opt .c{font-size:12px;color:var(--gold)}
.menu .opt .d{font-size:11px;color:var(--ink-soft)}
.menu .opt.off{opacity:.42}
.menu .row{display:flex;gap:6px}
.menu .row button{flex:1;font-size:14px;padding:8px 6px}
.menu .info{font-size:12px;color:var(--ink-soft);margin:0 2px 8px;line-height:1.5}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--primary);color:var(--primary-ink);padding:6px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:6}
.toast.on{opacity:.95}
.saga{position:absolute;left:0;right:0;top:38%;z-index:7;text-align:center;pointer-events:none;opacity:0;transition:opacity .45s;padding:0 18px}
.saga.on{opacity:1}
.saga span{display:inline-block;font-size:24px;font-weight:700;letter-spacing:3px;line-height:1.5;color:var(--ink);background:var(--overlay);padding:8px 18px;border-radius:12px;box-shadow:0 2px 14px var(--shadow)}
.saga.big span{font-size:30px;color:var(--zhusha);letter-spacing:6px}
@media (max-width:420px){.saga span{font-size:19px;letter-spacing:2px}.saga.big span{font-size:24px}}
.overlay{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:var(--overlay);border-radius:10px;padding:16px}
.overlay.hidden{display:none}
.card{text-align:center;max-width:320px}
.card h2{font-size:30px;letter-spacing:8px;margin:0 0 6px}
.card p{font-size:15px;line-height:1.8;margin:6px 0;color:var(--ink-soft)}
.card .stars{font-size:38px;color:var(--zhusha);letter-spacing:6px;margin:6px 0}
.card .stars .no{color:var(--line)}
.card button{margin-top:12px;min-width:140px}
@media (max-width:420px){
  .hud h1{font-size:17px;letter-spacing:2px;margin-right:2px}
  .stat{padding:3px 8px;font-size:13px}
  .stat b{font-size:15px}
  button{font-size:14px;padding:9px 9px}
}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <h1>守炉</h1>
    <div class="stat fire"><span class="dot" style="background:var(--zhusha)"></span>炉火 <b id="hp">10</b></div>
    <div class="stat stone"><span class="dot" style="background:var(--gold)"></span>灵石 <b id="money">0</b></div>
    <div class="stat"><b id="wave">0</b>/10 波</div>
  </header>
  <div class="xi"><span>丹成</span><div class="xi-bar"><div id="xiFill"></div></div><span id="xiText">0/49 息</span></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="menu" class="menu hidden"></div>
    <div id="toast" class="toast"></div>
    <div id="saga" class="saga"><span></span></div>
    <div id="overlay" class="overlay">
      <div class="card" id="card">
        <h2>守炉</h2>
        <p>丹需七七四十九息方成。<br>丹香引得妖兽下山，直奔丹炉。<br>小满沿山道布符，守到丹成。</p>
        <p style="font-size:13px">点虚线圈布符 · 点符升级或拆除<br>每只妖兽入炉，损一点炉火<br>兽潮自会来，也可提前召唤多得灵石</p>
        <button class="primary" id="startBtn">入丹房</button>
      </div>
    </div>
  </div>
  <div class="preview" id="preview"></div>
  <footer class="controls">
    <button class="primary" id="nextBtn">开始第一波</button>
    <button id="speedBtn">×1</button>
    <button id="pauseBtn">暂停</button>
    <button id="restartBtn">重来</button>
  </footer>
</div>
<script>
(()=>{
'use strict';
// ============ WORLD ============
const W=600,H=760;
const PATH=[[-30,90],[470,90],[470,260],[130,260],[130,440],[470,440],[470,600],[300,600],[300,690]];
const SEGS=[];let PATH_LEN=0;
for(let i=0;i<PATH.length-1;i++){const[x1,y1]=PATH[i],[x2,y2]=PATH[i+1];const l=Math.hypot(x2-x1,y2-y1);SEGS.push({x1,y1,x2,y2,l,s:PATH_LEN,nx:-(y2-y1)/l,ny:(x2-x1)/l});PATH_LEN+=l;}
const FURN={x:300,y:716};
const AIR0={x:-30,y:150};
const AIR_LEN=Math.hypot(FURN.x-AIR0.x,FURN.y-18-AIR0.y);
const SPOTS=[[220,175],[390,175],[555,190],[45,350],[300,350],[220,520],[390,520],[550,520],[390,680]];
const START_MONEY=160, WAVE_GAP=20, FIRST_GAP=25, EARLY_RATE=1.5;
const CN=['一','二','三','四','五','六','七','八','九','十'];

const TOWERS={
  jian:{name:'剑阵',glyph:'剑',color:'#35566e',desc:'快·单体·可击飞禽',cost:[60,50,80],range:[120,130,145],rate:[0.5,0.42,0.34],dmg:[11,17,27],air:true},
  huo:{name:'火符',glyph:'火',color:'#b0412e',desc:'慢·溅射·不及飞禽',cost:[90,80,120],range:[110,118,128],rate:[1.7,1.6,1.5],dmg:[26,42,64],splash:[48,55,64],air:false},
  han:{name:'寒符',glyph:'寒',color:'#3f87a6',desc:'范围减速五成',cost:[80,70,100],range:[95,105,115],rate:[0.5,0.5,0.5],dmg:[2,3.5,5.5],slow:[0.5,0.55,0.6],air:true},
  lei:{name:'雷符',glyph:'雷',color:'#6a4c86',desc:'连锁三跳·可击飞禽',cost:[150,120,160],range:[130,140,150],rate:[1.5,1.35,1.2],dmg:[32,50,75],jumps:3,air:true,unlock:4},
};
const TORDER=['jian','huo','han','lei'];
const LVNAME=['一重','二重','三重'];
const BEASTS={
  boar:{name:'野猪',hp:55,speed:42,reward:5,r:11,color:'#5b4635'},
  zheng:{name:'狰',hp:32,speed:78,reward:4,r:9,color:'#8b3a2a'},
  qiuyu:{name:'犰狳',hp:150,speed:28,reward:10,r:12,color:'#4d5960',armor:true},
  qique:{name:'鬿雀',hp:42,speed:46,reward:7,r:10,color:'#2a2a31',fly:true},
  kui:{name:'夔牛',hp:2600,speed:20,reward:80,r:24,color:'#36383f',boss:true,dmg:3},
};
const INTRO={
  zheng:'狰来了：快而脆，速杀之',
  qiuyu:'犰狳：甲厚，剑阵只伤一半',
  qique:'鬿雀：飞越山道，唯剑阵、雷符可击',
  kui:'夔牛来了！一蹄入炉，损三点炉火',
};
// [type,count,gap,startDelay]
const WAVES=[
  [['boar',8,1.4,0]],
  [['boar',12,1.1,0]],
  [['boar',8,1.3,0],['zheng',8,0.9,5]],
  [['boar',8,1.2,0],['qiuyu',4,2.5,3]],
  [['boar',6,1.2,0],['zheng',8,0.8,2],['qique',6,1.6,6]],
  [['boar',10,1.0,0],['qiuyu',5,2.2,4],['zheng',8,0.7,10]],
  [['qique',10,1.2,0],['zheng',12,0.6,3],['boar',6,1,8]],
  [['qiuyu',8,1.8,0],['boar',12,0.9,2],['qique',6,1.4,10]],
  [['zheng',15,0.5,0],['qiuyu',8,1.6,4],['qique',10,1.1,8]],
  [['boar',10,1.0,0],['qiuyu',6,1.8,4],['qique',8,1.3,8],['kui',1,1,14]],
];
const hpScale=w=>1+0.12*(w-1);
// 银月: the hero. Tap her, then tap a place; standing, she holds up to two ground beasts and bites; howls to stun a crowd.
const HERO={hp:[300,380,470],dmg:[22,30,40],rate:0.8,speed:120,reach:30,block:2,howlCd:12,howlR:95,howlStun:1.6,howlDmg:[10,16,24],regen:12,respawn:12,xp:[60,150]};
const BITE={boar:6,zheng:4,qiuyu:9,kui:40};
const HERO_HOME={x:300,y:660};
function newHero(){return{x:390,y:600,tx:390,ty:600,hp:HERO.hp[0],lvl:0,xp:0,cd:0,howl:4,dead:0,face:-1,anim:0,say:null,held:[]};}

// ============ CORE (pure, used by game + sim) ============
function newGame(headless){
  return {t:0,hp:10,money:START_MONEY,wave:0,queue:[],nextTimer:FIRST_GAP,beasts:[],towers:SPOTS.map(()=>null),proj:[],fx:[],
    hero:newHero(),shake:0,furnFlash:0,over:null,headless:!!headless,sel:-1,uid:0,seen:{},events:[],stats:{kills:0,leaks:{},built:{}}};
}
function emit(g,e){if(!g.headless)g.events.push(e);}
function posOnPath(d,off){
  if(d<=0){const s=SEGS[0];return{x:s.x1+(s.x2-s.x1)*d/s.l+s.nx*off,y:s.y1+s.ny*off,ang:0};}
  for(const s of SEGS){if(d<=s.s+s.l){const k=(d-s.s)/s.l;return{x:s.x1+(s.x2-s.x1)*k+s.nx*off,y:s.y1+(s.y2-s.y1)*k+s.ny*off,dx:s.x2-s.x1};}}
  const s=SEGS[SEGS.length-1];return{x:s.x2,y:s.y2,dx:0};
}
function place(b){
  if(b.fly){const k=b.d/AIR_LEN;b.x=AIR0.x+(FURN.x-AIR0.x)*k;b.y=AIR0.y+(FURN.y-18-AIR0.y)*k+Math.sin(b.d*0.08+b.id)*4;b.face=1;}
  else{const p=posOnPath(b.d,b.off);b.x=p.x;b.y=p.y;if(p.dx>0)b.face=1;else if(p.dx<0)b.face=-1;}
}
function spawn(g,type){
  const B=BEASTS[type];const hp=B.boss?B.hp:Math.round(B.hp*hpScale(g.wave));
  const b={id:++g.uid,type,hp,max:hp,speed:B.speed*(0.95+Math.random()*0.1),d:0,off:B.boss?0:(Math.random()*16-8),fly:!!B.fly,armor:!!B.armor,
    reward:B.reward,dmg:B.dmg||1,len:B.fly?AIR_LEN:PATH_LEN,slowT:0,slowF:0,stunT:0,held:false,flash:0,face:1,x:0,y:0,dead:false};
  place(b);g.beasts.push(b);
  if(!g.seen[type]){g.seen[type]=1;if(INTRO[type])emit(g,{toast:INTRO[type]});}
}
function callWave(g,auto){
  if(g.over||g.wave>=WAVES.length||g.queue.length)return -1;
  const bonus=!auto?Math.round(g.nextTimer*EARLY_RATE):0;
  g.money+=bonus;g.wave++;
  emit(g,{banner:g.wave===WAVES.length?'最后一波':'第'+CN[g.wave-1]+'波'});
  const q=[];for(const[type,n,gap,st]of WAVES[g.wave-1])for(let i=0;i<n;i++)q.push({at:g.t+st+i*gap,type});
  q.sort((a,b)=>a.at-b.at);g.queue=q;g.nextTimer=WAVE_GAP;
  if(g.wave===TOWERS.lei.unlock)emit(g,{toast:'雷符已解锁'});
  emit(g,{sound:'wave'});if(bonus>0)emit(g,{toast:'提前召唤 +'+bonus+' 灵石'});
  return bonus;
}
function canBuild(g,i,type){const D=TOWERS[type];return !g.towers[i]&&g.money>=D.cost[0]&&!(D.unlock&&g.wave<D.unlock);}
function build(g,i,type){
  if(!canBuild(g,i,type))return false;const D=TOWERS[type];
  g.money-=D.cost[0];g.towers[i]={type,lvl:0,spent:D.cost[0],cd:0.2,x:SPOTS[i][0],y:SPOTS[i][1],anim:0,ang:0};
  g.stats.built[type]=(g.stats.built[type]||0)+1;emit(g,{sound:'build'});return true;
}
function upgradeCost(tw){return tw.lvl<2?TOWERS[tw.type].cost[tw.lvl+1]:Infinity;}
function upgrade(g,i){const tw=g.towers[i];if(!tw||tw.lvl>=2)return false;const c=upgradeCost(tw);if(g.money<c)return false;g.money-=c;tw.spent+=c;tw.lvl++;emit(g,{sound:'build'});return true;}
function refund(tw){return Math.floor(tw.spent*0.6);}
function sell(g,i){const tw=g.towers[i];if(!tw)return false;g.money+=refund(tw);g.towers[i]=null;return true;}
function addFx(g,f){if(!g.headless)g.fx.push(f);}
function hurt(g,b,d,src){
  if(b.dead)return;
  if(src==='jian'&&b.armor)d*=0.5;
  b.hp-=d;b.flash=0.1;
  if(!g.headless&&src!=='han')addFx(g,{k:'txt',x:b.x+(Math.random()*10-5),y:b.y-BEASTS[b.type].r-4,s:String(Math.round(d)),col:src==='jian'&&b.armor?'#7a7066':'#2a241d',life:0.6,max:0.6,vy:-30,size:11});
  if(b.hp<=0){
    b.dead=true;g.money+=b.reward;g.stats.kills++;
    if(src==='yue')heroXp(g,b.reward);
    if(!g.headless){
      const r=BEASTS[b.type].r;const blobs=[];for(let k=0;k<7;k++){const a=Math.random()*6.28,dd=Math.random()*r*1.4;blobs.push([Math.cos(a)*dd,Math.sin(a)*dd*0.6,r*(0.3+Math.random()*0.5)]);}
      addFx(g,{k:'ink',x:b.x,y:b.y+r*0.3,blobs,life:1.6,max:1.6,col:BEASTS[b.type].color});
      for(let k=0;k<10;k++){const a=Math.random()*6.28,v=40+Math.random()*90;addFx(g,{k:'drop',x:b.x,y:b.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,r:1.5+Math.random()*2.5,life:0.6,max:0.6});}
      addFx(g,{k:'txt',x:b.x,y:b.y-14,s:'+'+b.reward,col:'#9a7418',life:1,max:1,vy:-26,size:14,bold:true});
      emit(g,{sound:'kill'});
    }
  }
}
function pickTarget(g,x,y,R,air){
  let best=null,bv=1e9;
  for(const b of g.beasts){if(b.dead||(b.fly&&!air))continue;const dx=b.x-x,dy=b.y-y;if(dx*dx+dy*dy>R*R)continue;const rem=b.len-b.d;if(rem<bv){bv=rem;best=b;}}
  return best;
}
function chain(g,tw,t,dmg){
  const D=TOWERS.lei;const hit=new Set();let cur=t;const pts=[[tw.x,tw.y-26]];
  for(let j=0;j<=D.jumps&&cur;j++){
    hit.add(cur);pts.push([cur.x,cur.y]);hurt(g,cur,dmg,'lei');dmg*=0.8;
    let nb=null,nd=95*95;for(const b of g.beasts){if(b.dead||hit.has(b))continue;const dx=b.x-cur.x,dy=b.y-cur.y,dd=dx*dx+dy*dy;if(dd<nd){nd=dd;nb=b;}}
    cur=nb;
  }
  if(!g.headless){const jag=[];for(let i=0;i<pts.length-1;i++){const[a,b2]=[pts[i],pts[i+1]];jag.push(a);for(let k=1;k<5;k++){const f=k/5;jag.push([a[0]+(b2[0]-a[0])*f+(Math.random()*12-6),a[1]+(b2[1]-a[1])*f+(Math.random()*12-6)]);}}jag.push(pts[pts.length-1]);addFx(g,{k:'bolt',pts:jag,life:0.25,max:0.25});emit(g,{sound:'zap'});}
}
function step(g,dt){
  if(g.over)return;
  g.t+=dt;
  while(g.queue.length&&g.queue[0].at<=g.t)spawn(g,g.queue.shift().type);
  if(g.wave<WAVES.length&&!g.queue.length){g.nextTimer-=dt;if(g.nextTimer<=0)callWave(g,true);}
  for(const b of g.beasts){
    if(b.dead)continue;
    if(b.slowT>0){b.slowT-=dt;if(b.slowT<=0)b.slowF=0;}
    if(b.stunT>0)b.stunT-=dt;
    if(!b.held&&!(b.stunT>0))b.d+=b.speed*(1-b.slowF)*dt;b.flash-=dt;
    if(b.d>=b.len){
      b.dead=true;g.hp-=b.dmg;g.stats.leaks[b.type]=(g.stats.leaks[b.type]||0)+1;
      g.shake=Math.min(16,g.shake+6*b.dmg);g.furnFlash=0.5;emit(g,{sound:'hit'});
      if(!g.headless)addFx(g,{k:'txt',x:FURN.x,y:FURN.y-40,s:'炉火 -'+b.dmg,col:'#b0412e',life:1.2,max:1.2,vy:-24,size:16,bold:true});
      if(g.hp<=0){g.hp=0;g.over='lose';}
    }else place(b);
  }
  heroStep(g,dt);
  for(const tw of g.towers){
    if(!tw)continue;const D=TOWERS[tw.type],L=tw.lvl;tw.cd-=dt;tw.anim-=dt;if(tw.cd>0)continue;
    const R=D.range[L];
    if(tw.type==='han'){
      let any=false;

function planPolicy(plan){return g=>{
  g._pi=g._pi||0;
  while(g._pi<plan.length){
    const a=plan[g._pi];let ok;
    if(a[0]==='b'){if(g.towers[a[1]]){g._pi++;continue;}ok=build(g,a[1],a[2]);}
    else{const tw=g.towers[a[1]];if(!tw||tw.lvl>=2){g._pi++;continue;}ok=upgrade(g,a[1]);}
    if(ok)g._pi++;else break;
  }

  if(g.wave===0)callWave(g);
};}

function updateFx(dt){
  for(const f of g.fx){f.life-=dt;if(f.vx!==undefined){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=(f.k==='drop'?260:120)*dt;}else if(f.vy){f.y+=f.vy*dt;}}
  g.fx=g.fx.filter(f=>f.life>0);
  g.shake=Math.max(0,g.shake-dt*30);g.furnFlash=Math.max(0,g.furnFlash-dt);
  const h=g.hero;if(h.say){h.say.life-=dt;if(h.say.life<=0)h.say=null;}
  if(h.dead>0&&heroSel)heroSel=false;
}

let AC=null;
function blip(f,d,type,vol){try{if(!AC)return;const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'sine';o.frequency.value=f;gn.gain.value=vol||0.04;gn.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.connect(gn).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
let lastKill=0;
function sound(s){
  if(s==='build')blip(520,0.12,'triangle',0.05);
  else if(s==='hit'){blip(110,0.35,'sawtooth',0.07);}
  else if(s==='wave'){blip(330,0.25,'triangle',0.05);setTimeout(()=>blip(440,0.3,'triangle',0.05),120);}
  else if(s==='bite')blip(260,0.05,'square',0.018);
  else if(s==='howl'){blip(420,0.5,'sine',0.05);setTimeout(()=>blip(640,0.6,'sine',0.04),140);}
  else if(s==='kill'){const n=performance.now();if(n-lastKill>70){lastKill=n;blip(760+Math.random()*120,0.06,'sine',0.025);}}
}

let sagaT=0;const sagaQ=[];const sagaEl=$('saga');
function saga(lines){sagaQ.length=0;sagaT=0;for(const l of lines)sagaQ.push(l);}
function pumpSaga(dt){sagaT-=dt;if(sagaT<=0){if(sagaQ.length){const l=sagaQ.shift();sagaEl.firstChild.textContent=l.s;sagaEl.classList.toggle('big',!!l.big);sagaEl.classList.add('on');sagaT=l.d||2.6;}else sagaEl.classList.remove('on');}}
const INTRO_SAGA=[
  {s:'丹炉初开，丹香随风散入山中'},
  {s:'山道尽头，兽吼渐起……'},
  {s:'兽潮来袭！',big:true,d:1.8},
  {s:'沿山道布符，守住丹炉',d:2.8},
  {s:'银月：小满，山道交给我。',d:2.6},
];
let toastT=0;const toastQ=[];
function toast(s){toastQ.push(s);}
function pumpToast(dt){toastT-=dt;if(toastT<=0){if(toastQ.length){toastEl.textContent=toastQ.shift();toastEl.classList.add('on');toastT=2.6;}else toastEl.classList.remove('on');}}

function fit(){
  const app=$('app');const wrapW=app.clientWidth-32;
  const top=stage.getBoundingClientRect().top+window.scrollY;
  const below=$('preview').offsetHeight+document.querySelector('.controls').offsetHeight+30;
  const availH=Math.max(300,window.innerHeight-top-below);
  const w=Math.floor(Math.max(260,Math.min(wrapW,availH*W/H))),h=Math.floor(w*H/W);
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=w+'px';cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  stage.style.width=w+'px';stage.style.height=h+'px';sc=w/W;
  if(g.sel>=0)openMenu(g.sel);
}
window.addEventListener('resize',fit);

function toWorld(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/sc,y:(e.clientY-r.top)/sc};}
cv.addEventListener('pointerdown',e=>{
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(_){}}
  if(g.over)return;
  const p=toWorld(e),h=g.hero;
  if(!h.dead&&Math.hypot(p.x-h.x,p.y-(h.y-6))<28){heroSel=!heroSel;closeMenu();return;}
  if(heroSel){heroSel=false;h.tx=Math.max(14,Math.min(W-14,p.x));h.ty=Math.max(80,Math.min(H-24,p.y));addFx(g,{k:'mark',x:h.tx,y:h.ty,life:0.6,max:0.6});return;}
  let hit=-1,bd=34*34;
  SPOTS.forEach(([x,y],i)=>{const dx=p.x-x,dy=p.y-(g.towers[i]?y-12:y),d=dx*dx+dy*dy;if(d<bd){bd=d;hit=i;}});
  if(hit>=0&&hit!==g.sel){g.sel=hit;openMenu(hit);}else closeMenu();
});
function closeMenu(){g.sel=-1;menu.classList.add('hidden');menu.innerHTML='';}
function openMenu(i){
  const tw=g.towers[i];
  if(!tw){
    menu.innerHTML='<div class="title">布符<span>点选</span></div><div class="grid">'+TORDER.map(k=>{const D=TOWERS[k];return `<button class="opt" data-build="${k}"><span class="g" style="color:${D.color}">${D.glyph} ${D.name.slice(1)}</span><span class="c">${D.cost[0]} 灵石</span><span class="d">${D.unlock?'<i data-lock>第四波解锁 · </i>':''}${D.desc}</span></button>`;}).join('')+'</div>';
  }else{
    const D=TOWERS[tw.type],L=tw.lvl;
    const next=L<2?`下一重：伤 ${D.dmg[L+1]}${D.slow?'，减速 '+Math.round(D.slow[L+1]*100)+'%':''}，距 ${D.range[L+1]}`:'已至三重';
    menu.innerHTML=`<div class="title">${D.name} · ${LVNAME[L]}<span>伤 ${D.dmg[L]} · 距 ${D.range[L]}</span></div><div class="info">${D.desc}<br>${next}</div><div class="row"><button data-up>${L<2?'升级 '+D.cost[L+1]:'已满'}</button><button data-sell>拆 +${refund(tw)}</button></div>`;
  }
  menu.classList.remove('hidden');
  const [x,y]=SPOTS[i],sx=x*sc,sy=y*sc,mw=menu.offsetWidth,mh=menu.offsetHeight,sw=stage.clientWidth,sh=stage.clientHeight;
  let left=Math.max(4,Math.min(sw-mw-4,sx-mw/2));let top=sy-mh-30*sc;if(top<4)top=sy+30*sc;if(top+mh>sh-4)top=Math.max(4,sh-mh-4);
  menu.style.left=left+'px';menu.style.top=top+'px';
  refreshMenu();
}
function refreshMenu(){
  if(g.sel<0)return;const tw=g.towers[g.sel];
  if(!tw){menu.querySelectorAll('[data-build]').forEach(b=>{const k=b.dataset.build,D=TOWERS[k],locked=D.unlock&&g.wave<D.unlock;b.classList.toggle('off',locked||g.money<D.cost[0]);const lk=b.querySelector('[data-lock]');if(lk)lk.style.display=locked?'':'none';});}
  else{const up=menu.querySelector('[data-up]');if(up)up.disabled=tw.lvl>=2||g.money<upgradeCost(tw);}
}
menu.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const i=g.sel;if(i<0)return;
  if(b.dataset.build){if(build(g,i,b.dataset.build))closeMenu();else{const D=TOWERS[b.dataset.build];toast(D.unlock&&g.wave<D.unlock?'雷符第四波方解锁':'灵石不足');}}
  else if(b.hasAttribute('data-up')){if(upgrade(g,i))openMenu(i);}
  else if(b.hasAttribute('data-sell')){sell(g,i);closeMenu();}
});
$('nextBtn').addEventListener('click',()=>{if(!started)return;sagaQ.length=0;sagaT=0;callWave(g,false);});
$('speedBtn').addEventListener('click',()=>{speed=speed===1?2:1;$('speedBtn').textContent='×'+speed;});
$('pauseBtn').addEventListener('click',()=>{paused=!paused;$('pauseBtn').textContent=paused?'继续':'暂停';});
$('restartBtn').addEventListener('click',restart);
$('startBtn').addEventListener('click',()=>{started=true;$('overlay').classList.add('hidden');saga(INTRO_SAGA);toast('点银月，再点一处，调她迎敌');if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(_){}}});
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('pauseBtn').click();}});
function restart(){g=newGame(false);heroSel=false;paused=false;acc=0;overShown=false;$('pauseBtn').textContent='暂停';closeMenu();toastQ.length=0;started=true;$('overlay').classList.add('hidden');saga(INTRO_SAGA.slice(2));}

let lastPreviewKey='';
function updateUI(){
  $('hp').textContent=g.hp;$('money').textContent=g.money;$('wave').textContent=g.wave;
  const cl=cleared(g),xi=Math.round(49*cl/WAVES.length);$('xiFill').style.width=(100*cl/WAVES.length)+'%';$('xiText').textContent=xi+'/49 息';
  const nb=$('nextBtn');
  if(g.over){nb.disabled=true;nb.textContent=g.over==='win'?'丹成':'丹毁';}
  else if(g.wave===0&&!started){nb.disabled=true;nb.textContent='第一波';}
  else if(g.wave>=WAVES.length){nb.disabled=true;nb.textContent=g.queue.length?'最后一波来袭':'守住最后一波';}
  else if(g.queue.length){nb.disabled=true;nb.textContent='第'+g.wave+'波来袭中…';}
  else{nb.disabled=false;const s=Math.ceil(g.nextTimer);nb.textContent=`${g.wave===0?'第一波':'下一波'} · ${s}秒 (提前 +${Math.round(g.nextTimer*EARLY_RATE)}灵石)`;}
  const nw=(g.wave<WAVES.length&&!g.over)?WAVES[g.wave]:null;
  const key=nw?g.wave:'x';
  if(key!==lastPreviewKey){lastPreviewKey=key;
    if(nw){const cnt={};for(const[t,n]of nw)cnt[t]=(cnt[t]||0)+n;
      $('preview').innerHTML=`<span>第${g.wave+1}波：</span>`+Object.keys(cnt).map(t=>`<span class="chip"><img src="${ICONS[t]}" alt="">${BEASTS[t].name}×${cnt[t]}</span>`).join('');}
    else $('preview').innerHTML=g.over?'':'<span>已是最后一波 · 守住即丹成</span>';
  }
  refreshMenu();
}
function showOver(){
  overShown=true;closeMenu();
  const win=g.over==='win',st=win?starsOf(g.hp):0;
  $('card').innerHTML=win?
    `<h2>丹成</h2><div class="stars">${'★'.repeat(st)}<span class="no">${'★'.repeat(3-st)}</span></div><p>四十九息已满，丹香满室。<br>炉火余 ${g.hp} / 10</p><button class="primary" id="againBtn">再守一炉</button>`:
    `<h2>丹毁</h2><p>炉火熄灭于第 ${g.wave} 波。<br>已守 ${Math.round(49*cleared(g)/WAVES.length)} 息，功亏一篑。</p><button class="primary" id="againBtn">重来</button>`;
  $('overlay').classList.remove('hidden');$('againBtn').addEventListener('click',restart);
}

function frame(now){
  const rdt=Math.min(0.1,(now-last)/1000);last=now;
  const run=started&&!paused&&!g.over;
  if(run){acc+=rdt*speed;let n=0;while(acc>=1/60&&n<12){step(g,1/60);acc-=1/60;n++;}if(n>=12)acc=0;}
  updateFx(run?rdt*speed:(g.over?rdt:0));
  for(const e of g.events){if(e.toast)toast(e.toast);if(e.sound)sound(e.sound);if(e.banner)saga([{s:e.banner,big:true,d:1.6}]);}g.events.length=0;
  pumpToast(rdt);pumpSaga(rdt);
  draw(rdt,now/1000);updateUI();
  if(g.over&&!overShown)showOver();
  requestAnimationFrame(frame);
}
makeIcons();fit();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
